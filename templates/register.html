{% extends "base.html" %}

{% block title %}Đăng Ký Tài Khoản - iTick{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <div class="bg-white/95 dark:bg-[#0B172A]/90 backdrop-blur-sm rounded-md border border-slate-200/80 dark:border-slate-800/80 shadow-md p-8 space-y-6 transition-colors">
    
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Tạo Tài Khoản Mới</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">Tham gia hệ thống bán vé iTick</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block">Họ và Tên</label>
        <input 
          type="text" 
          id="fullName" 
          required 
          placeholder="Nguyễn Văn A"
          class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-md text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-[#000080]/40 focus:outline-none transition-colors"
        />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block">Địa chỉ Email</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="name@example.com"
          class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-md text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-[#000080]/40 focus:outline-none transition-colors"
        />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block">Số điện thoại</label>
        <input 
          type="tel" 
          id="phone" 
          placeholder="0912345678"
          class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-md text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-[#000080]/40 focus:outline-none transition-colors"
        />
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block">Vai trò tham gia</label>
        <select 
          id="role" 
          class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-md text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-[#000080]/40 focus:outline-none transition-colors"
        >
          <option value="ATTENDEE">Khách tham dự (Mua vé)</option>
          <option value="ORGANIZER">Ban tổ chức (Đăng sự kiện & Soát vé)</option>
        </select>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block">Mật khẩu</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="Tối thiểu 6 ký tự"
          class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-md text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-[#000080]/40 focus:outline-none transition-colors"
        />
      </div>

      <div id="errorAlert" class="p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded-md text-xs text-red-700 dark:text-red-300 hidden"></div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-3 px-4 bg-[#000080] hover:bg-[#001B5E] dark:bg-[#1E60D5] dark:hover:bg-[#0D47A1] text-white font-bold text-sm rounded-md shadow-sm btn-tactile transition whitespace-nowrap"
      >
        Đăng ký tài khoản
      </button>

      <p class="text-center text-xs text-slate-500 dark:text-slate-400 pt-2">
        Đã có tài khoản? 
        <a href="/login" class="text-[#000080] dark:text-sky-400 font-semibold hover:underline whitespace-nowrap inline-block">Đăng nhập</a>
      </p>
    </form>

  </div>
</div>

<script>
  async function handleRegister(e) {
    e.preventDefault();
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const role = document.getElementById('role').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('errorAlert');
    const btn = document.getElementById('submitBtn');

    errEl.classList.add('hidden');
    btn.disabled = true;
    btn.innerText = "Đang xử lý...";

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          full_name: fullName,
          email: email,
          phone_number: phone,
          role: role,
          password: password
        })
      });

      const data = await res.json();

      if (res.ok) {
        alert("Đăng ký tài khoản thành công! Vui lòng đăng nhập.");
        window.location.href = '/login';
      } else {
        errEl.innerText = data.detail || "Đăng ký thất bại.";
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = "Đăng ký tài khoản";
      }
    } catch (err) {
      errEl.innerText = "Lỗi kết nối máy chủ: " + err.message;
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.innerText = "Đăng ký tài khoản";
    }
  }
</script>
{% endblock %}
