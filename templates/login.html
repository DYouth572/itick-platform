{% extends "base.html" %}

{% block title %}Đăng Nhập - iTick{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white/95 dark:bg-[#0B172A]/90 backdrop-blur-sm rounded-md border border-slate-200/80 dark:border-slate-800/80 shadow-md p-8 space-y-6 transition-colors">
    
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white text-balance">Đăng Nhập</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">Đăng nhập tài khoản iTick để tiếp tục</p>
    </div>

    <!-- Alert khi vừa đặt lại mật khẩu thành công -->
    <div id="resetSuccessAlert" class="hidden p-3.5 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 rounded-md text-xs text-emerald-800 dark:text-emerald-300 flex items-start gap-2">
      <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
      <span>Đặt lại mật khẩu thành công! Bạn có thể đăng nhập ngay với mật khẩu mới.</span>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <input type="hidden" id="redirectUrl" value="{{ redirect }}">

      <div class="space-y-1.5">
        <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block">Địa chỉ Email</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="your-email@example.com"
          class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-md text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-[#000080]/40 focus:outline-none transition-colors"
        />
      </div>

      <div class="space-y-1.5">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-slate-700 dark:text-slate-300 block">Mật khẩu</label>
          <a href="/forgot-password" class="text-xs font-semibold text-[#000080] dark:text-sky-400 hover:underline">Quên mật khẩu?</a>
        </div>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="••••••••"
          class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-md text-sm text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-[#000080]/40 focus:outline-none transition-colors"
        />
      </div>

      <div id="errorAlert" class="p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded-md text-xs text-red-700 dark:text-red-300 hidden"></div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-3 px-4 bg-[#000080] hover:bg-[#001B5E] dark:bg-[#1E60D5] dark:hover:bg-[#0D47A1] text-white font-bold text-sm rounded-md shadow-sm btn-tactile"
      >
        Đăng nhập
      </button>

      <p class="text-center text-xs text-slate-500 dark:text-slate-400 pt-2">
        Chưa có tài khoản? 
        <a href="/register" class="text-[#000080] dark:text-sky-400 font-semibold hover:underline whitespace-nowrap inline-block">Đăng ký ngay</a>
      </p>
    </form>

  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('reset') === 'success') {
      const resetAlert = document.getElementById('resetSuccessAlert');
      if (resetAlert) resetAlert.classList.remove('hidden');
    }
  });

  function fillAccount(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const redirectUrl = document.getElementById('redirectUrl').value || '/';
    const errEl = document.getElementById('errorAlert');
    const btn = document.getElementById('submitBtn');

    errEl.classList.add('hidden');
    btn.disabled = true;
    btn.innerText = "Đang xác thực...";

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });

      const data = await res.json();

      if (res.ok) {
        window.location.href = redirectUrl;
      } else {
        errEl.innerText = data.detail || "Đăng nhập thất bại. Vui lòng kiểm tra lại thông tin.";
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = "Đăng nhập";
      }
    } catch (err) {
      errEl.innerText = "Lỗi kết nối máy chủ: " + err.message;
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.innerText = "Đăng nhập";
    }
  }
</script>
{% endblock %}
